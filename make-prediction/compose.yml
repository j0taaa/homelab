services:
  make-prediction:
    image: ghcr.io/j0taaa/make-prediction:latest
    container_name: make-prediction
    restart: unless-stopped
    networks:
      - proxy
      - make-prediction-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.predict.rule=Host(`predict.${shared__base_domain:-jaypussy.site}`)"
      - "traefik.http.routers.predict.entrypoints=web"
      - "traefik.http.services.predict.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=make-prediction"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: make-prediction-watchtower
    restart: unless-stopped
    command: --interval 300 --cleanup --label-enable --scope make-prediction
    environment:
      - WATCHTOWER_SCOPE=make-prediction
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - make-prediction-internal

networks:
  proxy:
    external: true
  make-prediction-internal:
    driver: bridge
