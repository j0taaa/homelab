services:
  canvas-wrapper:
    image: ghcr.io/j0taaa/canvas-wrapper:latest
    container_name: canvas-wrapper
    restart: unless-stopped
    environment:
      - CANVAS_KEY=${canvas_wrapper__canvas_key:-}
      - CANVAS_API_BASE=${canvas_wrapper__canvas_api_base:-https://pucminas.instructure.com/api/v1}
      - NODE_ENV=production
    networks:
      - proxy
      - canvas-wrapper-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.canvas-wrapper.rule=Host(`janvas.${shared__base_domain:-jaypussy.site}`)"
      - "traefik.http.routers.canvas-wrapper.entrypoints=web"
      - "traefik.http.services.canvas-wrapper.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=canvas-wrapper"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: canvas-wrapper-watchtower
    restart: unless-stopped
    command: --interval 300 --cleanup --label-enable --scope canvas-wrapper
    environment:
      - WATCHTOWER_SCOPE=canvas-wrapper
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - canvas-wrapper-internal

networks:
  proxy:
    external: true
  canvas-wrapper-internal:
    driver: bridge
